services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - kt-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  kt-data:
